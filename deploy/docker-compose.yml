# STACKD production stack.
#
#   cd /opt/stackd && docker compose -f deploy/docker-compose.yml up -d --build
#
# Four containers on one small VM: Postgres, the two portals, and Caddy for TLS.
# That is enough for one branch by a wide margin — the constraint here is
# keeping personal data inside the Kingdom, not throughput.
#
# ⚠ Only the CUSTOMER portal is published. The admin portal is bound to the
# loopback interface and reachable solely through Caddy on a hostname you
# protect (see deploy/Caddyfile). Staff tools do not belong on the open internet.

name: stackd

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STACKD_DB:-stackd}
      POSTGRES_USER: ${POSTGRES_USER:-stackd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Postgres only reads these on a FIRST run against an empty volume.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in filename order, once, when the volume is empty. The platform
      # shim MUST come first: schema.sql references auth.users, which it creates.
      # Dev fixtures are deliberately absent — no fake staff in production.
      - ../supabase/01_platform_shim.sql:/docker-entrypoint-initdb.d/01_platform_shim.sql:ro
      - ../supabase/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
      - ../supabase/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    # Never published to the host. Only the app containers reach it.
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stackd} -d ${STACKD_DB:-stackd}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3002'
      DATABASE_URL: postgres://${POSTGRES_USER:-stackd}:${POSTGRES_PASSWORD}@db:5432/${STACKD_DB:-stackd}
      STACKD_DB: ${STACKD_DB:-stackd}
      STACKD_PORTAL_SECRET: ${STACKD_PORTAL_SECRET:?set STACKD_PORTAL_SECRET in .env}
      STACKD_PORTAL_URL: ${STACKD_PORTAL_URL:?set STACKD_PORTAL_URL in .env}
    expose:
      - '3002'

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgres://${POSTGRES_USER:-stackd}:${POSTGRES_PASSWORD}@db:5432/${STACKD_DB:-stackd}
      STACKD_DB: ${STACKD_DB:-stackd}
      STACKD_ADMIN_SECRET: ${STACKD_ADMIN_SECRET:?set STACKD_ADMIN_SECRET in .env}
      # Printed QR codes point at the customer portal, not at admin.
      STACKD_PORTAL_URL: ${STACKD_PORTAL_URL}
    expose:
      - '3001'
    volumes:
      # Menu photos uploaded through admin have to survive a redeploy, and the
      # website's build needs to see them. Bind-mounted from the checkout so
      # `npm run build` on the host picks up whatever was uploaded.
      - ../apps/web/public/menu:/app/apps/web/public/menu

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - portal
      - admin
    ports:
      - '80:80'
      - '443:443'
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-0.0.0.0/0}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
