# STACKD production stack.
#
#   cd /opt/stackd && docker compose -f deploy/docker-compose.yml up -d --build
#
# Four containers on one small VM: Postgres, the two portals, and Caddy for TLS.
# That is enough for one branch by a wide margin — the constraint here is
# keeping personal data inside the Kingdom, not throughput.
#
# ⚠ Only the CUSTOMER portal is published. The admin portal is bound to the
# loopback interface and reachable solely through Caddy on a hostname you
# protect (see deploy/Caddyfile). Staff tools do not belong on the open internet.

name: stackd

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STACKD_DB:-stackd}
      POSTGRES_USER: ${POSTGRES_USER:-stackd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Postgres only reads these on a FIRST run against an empty volume.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # ⚠ /var/lib/postgresql, NOT /var/lib/postgresql/data.
      #
      # Postgres 18 changed the convention: the image now stores the cluster in a
      # major-version subdirectory (/var/lib/postgresql/18/...) so that
      # `pg_upgrade --link` can work across versions without crossing a mount
      # boundary. Mounting the old `/data` path makes the entrypoint refuse to
      # start and restart-loop, complaining about data "in an unused
      # mount/volume". Every pre-18 example on the internet shows the old path.
      - pgdata:/var/lib/postgresql
      # Applied in filename order, once, when the volume is empty. The platform
      # shim MUST come first: schema.sql references auth.users, which it creates.
      # Dev fixtures are deliberately absent — no fake staff in production.
      # `:z` relabels for SELinux, which Oracle Linux and RHEL enforce by
      # default. Docker ignores it where SELinux is absent, so it is free
      # insurance — without it the container gets permission denied on files
      # that plainly exist with correct Unix permissions, which reads as a
      # missing-file bug rather than a labelling one.
      - ../supabase/01_platform_shim.sql:/docker-entrypoint-initdb.d/01_platform_shim.sql:ro,z
      - ../supabase/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro,z
      - ../supabase/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro,z
    # Never published to the host. Only the app containers reach it.
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stackd} -d ${STACKD_DB:-stackd}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3002'
      DATABASE_URL: postgres://${POSTGRES_USER:-stackd}:${POSTGRES_PASSWORD}@db:5432/${STACKD_DB:-stackd}
      STACKD_DB: ${STACKD_DB:-stackd}
      STACKD_PORTAL_SECRET: ${STACKD_PORTAL_SECRET:?set STACKD_PORTAL_SECRET in .env}
      STACKD_PORTAL_URL: ${STACKD_PORTAL_URL:?set STACKD_PORTAL_URL in .env}
      # Wallet passes, all optional. Unset means the button is simply not shown,
      # which is why none of these use the :? required form.
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_CLIENT_EMAIL: ${GOOGLE_WALLET_CLIENT_EMAIL:-}
      GOOGLE_WALLET_PRIVATE_KEY: ${GOOGLE_WALLET_PRIVATE_KEY:-}
      GOOGLE_WALLET_ORIGINS: ${GOOGLE_WALLET_ORIGINS:-}
      APPLE_WALLET_PASS_TYPE_ID: ${APPLE_WALLET_PASS_TYPE_ID:-}
      APPLE_WALLET_TEAM_ID: ${APPLE_WALLET_TEAM_ID:-}
      APPLE_WALLET_CERT_PEM: ${APPLE_WALLET_CERT_PEM:-}
      APPLE_WALLET_KEY_PEM: ${APPLE_WALLET_KEY_PEM:-}
      APPLE_WALLET_WWDR_PEM: ${APPLE_WALLET_WWDR_PEM:-}
    expose:
      - '3002'
    volumes:
      # Apple pass artwork comes from the website's icons, same files the tab
      # icon uses.
      - ../apps/web/public:/app/apps/web/public:ro,z

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgres://${POSTGRES_USER:-stackd}:${POSTGRES_PASSWORD}@db:5432/${STACKD_DB:-stackd}
      STACKD_DB: ${STACKD_DB:-stackd}
      STACKD_ADMIN_SECRET: ${STACKD_ADMIN_SECRET:?set STACKD_ADMIN_SECRET in .env}
      # Printed QR codes point at the customer portal, not at admin.
      STACKD_PORTAL_URL: ${STACKD_PORTAL_URL}
    expose:
      - '3001'
    volumes:
      # Menu photos uploaded through admin have to survive a redeploy, and the
      # website's build needs to see them. Bind-mounted from the checkout so
      # `npm run build` on the host picks up whatever was uploaded.
      - ../apps/web/public/menu:/app/apps/web/public/menu:z

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - portal
      - admin
    ports:
      - '80:80'
      - '443:443'
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-0.0.0.0/0}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
